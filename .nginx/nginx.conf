# access_log off;                       # disabilita i log di accesso per ridurre I/O

server {
    listen 80;                            # IPv4
    listen [::]:80;                       # IPv6
    server_name amabeefrestaurant.it;

    root  /usr/share/nginx/amabeef;       # assicurati che esista /usr/share/nginx/amabeef/index.html
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Menu: URL permanenti ──────────────────────────────────────────
    # Ogni categoria ha un solo URL stabile, senza data nel nome.
    # Per aggiornare un menu basta sostituire il PDF: i link nel sito,
    # i QR code stampati e i risultati Google restano validi.
    # I vecchi URL datati reindirizzano qui con 301 permanente, cosi'
    # chi ha un bookmark scarica comunque la versione aggiornata.
    # (location = ha precedenza sul regex .pdf sottostante)

    location = /files/amabeef-cadorago-como-menu-ristorante-2025.pdf {
        return 301 /files/amabeef-cadorago-como-menu-ristorante.pdf;
    }
    location = /files/amabeef-cadorago-como-menu-ristorante-01032026.pdf {
        return 301 /files/amabeef-cadorago-como-menu-ristorante.pdf;
    }
    location = /files/amabeef-cadorago-como-menu-ristorante-01052026.pdf {
        return 301 /files/amabeef-cadorago-como-menu-ristorante.pdf;
    }
    location = /files/amabeef-cadorago-como-menu-hamburger-011025.pdf {
        return 301 /files/amabeef-cadorago-como-menu-hamburger.pdf;
    }

    # ── Pagine mai completate, rimosse il 2026-08-05 ──────────────────
    # Erano viste vuote che rispondevano 200 e finivano nell'indice di
    # Google come thin content. Senza queste regole cadrebbero sul
    # catch-all della SPA, che restituisce 200 con la pagina 404 dentro
    # (soft 404): Google le terrebbe indicizzate ancora a lungo.
    # 410 Gone e' il segnale esplicito di rimozione definitiva.
    # Quando una pagina verra' compilata, togliere la sua riga qui e
    # riagganciare la rotta in src/router/index.js.

    location = /chi-siamo          { return 410; }
    location = /galleria-immagini  { return 410; }
    location = /contatti           { return 410; }
    location = /domande-frequenti  { return 410; }
    location = /news               { return 410; }
    location ^~ /news/             { return 410; }

    # --- no cache ---
    location ~* (^/(sw\.js|manifest\.json|robots\.txt|sitemap\.xml|index\.html)$)|(\.pdf$) {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires 0 always;

        expires off;
        etag off;

        # evita che cadano nel fallback SPA
        try_files $uri =404;
    }


    # location ~* \.(?:js|mjs|css)$ {
    #     if ($uri ~* "\.[a-f0-9]{8,}\.") {
    #         expires 1y;  add_header Cache-Control "public, max-age=31536000, immutable" always;
    #     }
    #     if ($uri !~* "\.[a-f0-9]{8,}\.") {
    #         expires 7d;  add_header Cache-Control "public, max-age=604800" always;
    #     }
    #     try_files $uri =404;
    # }

    # location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico)$ {
    #     if ($uri ~* "\.[a-f0-9]{8,}\.") {
    #         expires 1y;  add_header Cache-Control "public, max-age=31536000, immutable" always;
    #     }
    #     if ($uri !~* "\.[a-f0-9]{8,}\.") {
    #         expires 90d; add_header Cache-Control "public, max-age=7776000" always;
    #     }
    #     try_files $uri =404;
    # }

    # location ~* \.(?:woff2?|ttf|eot|otf)$ {
    #     add_header Access-Control-Allow-Origin "*" always;
    #     expires 1y; add_header Cache-Control "public, max-age=31536000, immutable" always;
    #     try_files $uri =404;
    # }

    # Hardening
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
}